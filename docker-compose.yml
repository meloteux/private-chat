version: '3.8'

services:
  app:
    build: .
    container_name: private-chat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-generated_at_runtime}
    volumes:
      - ./uploads:/app/uploads
      - ./chat.db:/app/chat.db
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: private-chat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app