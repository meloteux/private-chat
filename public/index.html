<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chat Privado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="screen active">
    <div class="login-container">
      <h1>💬 Chat Privado</h1>
      <p class="subtitle">Conversa segura entre você e sua pessoa especial</p>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <div id="login-error" class="error hidden"></div>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <button id="back-btn" class="btn btn-secondary btn-sm mobile-only" title="Voltar" aria-label="Voltar para contatos">←</button>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Sair</button>
        <h2 id="chat-title">Chat Privado</h2>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="btn btn-secondary btn-sm" title="Alternar tema" aria-label="Alternar tema">
          <span id="theme-icon">🌙</span>
        </button>
        <span id="current-user" class="user-badge"></span>
      </div>
    </header>
    
    <main class="chat-main">
      <aside class="contacts-panel">
        <h3>Contatos</h3>
        <input type="search" id="contact-search" class="contact-search" placeholder="Buscar contato..." autocomplete="off" aria-label="Buscar contato">
        <ul id="contacts-list" class="contacts-list"></ul>
      </aside>
      
      <section class="chat-panel">
        <div id="no-chat-selected" class="no-chat">
          <p>Selecione um contato para começar a conversar</p>
        </div>
        <div id="chat-container" class="chat-container hidden">
          <div id="messages-area" class="messages-area"></div>
          
          <div id="reply-preview" class="reply-preview hidden">
            <span id="reply-preview-text"></span>
            <button type="button" id="reply-cancel" class="btn btn-secondary btn-sm">×</button>
          </div>

          <form id="message-form" class="message-form">
            <div class="message-input-wrapper">
              <button type="button" id="attach-btn" class="attach-btn" title="Anexar arquivo" aria-label="Anexar arquivo">📎</button>
              <input type="file" id="file-input" accept="image/*,audio/*" hidden>
              <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off">
              <button type="button" id="audio-btn" class="audio-btn" title="Gravar áudio" aria-label="Gravar áudio">🎤</button>
            </div>
            <button type="submit" class="btn btn-primary" id="send-btn">Enviar</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div id="audio-recorder" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="audio-title">
    <div class="modal-content audio-recorder-content">
      <h3 id="audio-title">Gravando áudio...</h3>
      <div class="audio-visualizer" id="audio-visualizer"></div>
      <div class="audio-timer" id="audio-timer">00:00</div>
      <div class="audio-controls">
        <button type="button" id="audio-cancel" class="btn btn-secondary">Cancelar</button>
        <button type="button" id="audio-stop" class="btn btn-danger" disabled>Parar</button>
        <button type="button" id="audio-send" class="btn btn-primary" disabled>Enviar</button>
      </div>
    </div>
  </div>

  <div id="context-menu" class="context-menu hidden" role="menu">
    <button type="button" class="context-menu-item" data-action="reply" role="menuitem">💬 Responder</button>
    <button type="button" class="context-menu-item" data-action="edit" role="menuitem">✏️ Editar</button>
    <button type="button" class="context-menu-item" data-action="delete" role="menuitem">🗑️ Apagar para mim</button>
    <button type="button" class="context-menu-item" data-action="delete-everyone" role="menuitem">🗑️ Apagar para todos</button>
    <button type="button" class="context-menu-item" data-action="react" role="menuitem">⭐ Reagir</button>
  </div>

  <div id="reaction-picker" class="reaction-picker hidden" role="menu">
    <button type="button" class="reaction-btn" data-emoji="👍" role="menuitem">👍</button>
    <button type="button" class="reaction-btn" data-emoji="❤️" role="menuitem">❤️</button>
    <button type="button" class="reaction-btn" data-emoji="😂" role="menuitem">😂</button>
    <button type="button" class="reaction-btn" data-emoji="😮" role="menuitem">😮</button>
    <button type="button" class="reaction-btn" data-emoji="😢" role="menuitem">😢</button>
    <button type="button" class="reaction-btn" data-emoji="😡" role="menuitem">😡</button>
    <button type="button" class="reaction-btn" data-emoji="🎉" role="menuitem">🎉</button>
    <button type="button" class="reaction-btn" data-emoji="🙏" role="menuitem">🙏</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
