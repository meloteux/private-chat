# Nginx configuration for private-chat application
# Reverse proxy with WebSocket support

server {
    listen 80;
    server_name localhost;  # Change this to your domain in production

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'";

    # Increase file upload limit
    client_max_body_size 25M;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # WebSocket support
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK\n';
        add_header Content-Type text/plain;
    }

    # Serve static files (if needed)
    location /public/ {
        alias /path/to/private-chat/public/;
        expires 30d;
        access_log off;
    }

    # Serve uploads (if needed)
    location /uploads/ {
        alias /path/to/private-chat/uploads/;
        expires 30d;
        access_log off;
    }
}